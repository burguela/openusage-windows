name: Windows

# Builds Quota Tray, this fork's Windows app: the shared Swift engine (`openusage-cli.exe`, shipped as
# `quotatray-engine.exe`) plus the WPF notification-area app (`QuotaTray.exe`), packaged into one zip
# artifact. See docs/windows.md.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The runner's Visual Studio ships an MSVC STL that asks for Clang 20+, newer than the Clang inside
  # the Swift 6.2 toolchain. swift-crypto's BoringSSL is the only C++ in the build and compiles fine
  # with it, so allow the mismatch rather than pinning an older Visual Studio.
  STL_MISMATCH: -Xcc -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH

jobs:
  windows:
    name: Build Windows App
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Build engine
        run: swift build -c release --product openusage-cli ${{ env.STL_MISMATCH }}

      - name: Smoke-test engine
        shell: pwsh
        run: |
          $out = .build/release/openusage-cli.exe dashboard --cached | ConvertFrom-Json
          if ($out.schema -ne 'openusage.desktop.v1') { throw "unexpected schema: $($out.schema)" }
          Write-Host "providers: $($out.providers.id -join ', ')"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish tray app
        run: >
          dotnet publish windows/QuotaTray/QuotaTray.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist/QuotaTray

      - name: Render panel screenshots
        shell: pwsh
        run: |
          $p = Start-Process dist/QuotaTray/QuotaTray.exe -Wait -PassThru -ArgumentList @(
            '--render-preview', 'windows/QuotaTray/Preview/sample-dashboard.json', 'dist/screenshots')
          if ($p.ExitCode -ne 0) { throw "preview render failed ($($p.ExitCode))" }
          Get-ChildItem dist/screenshots | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: QuotaTray-windows-screenshots
          path: dist/screenshots
          if-no-files-found: error

      - name: Publish screenshots to a review branch (temporary)
        if: github.event_name == 'push'
        shell: pwsh
        env:
          TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP shots
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist/screenshots/*.png $dir
          Set-Location $dir
          git init -q -b screenshots
          git -c user.name=ci -c user.email=ci@localhost add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Panel screenshots for ${{ github.sha }}"
          git push -q "https://x-access-token:$env:TOKEN@github.com/${{ github.repository }}" "screenshots:refs/heads/review/quotatray-screenshots-${{ github.run_id }}"

      - name: Package
        shell: pwsh
        run: windows/scripts/package.ps1 -BuildDir .build/release -OutDir dist/QuotaTray

      - uses: actions/upload-artifact@v4
        with:
          name: QuotaTray-windows-x64
          path: dist/QuotaTray
          if-no-files-found: error

      - name: Build installer
        shell: pwsh
        run: |
          $version = (& dist/QuotaTray/quotatray-engine.exe dashboard --cached | ConvertFrom-Json).appVersion
          if (-not $version) { throw 'the engine did not report an app version' }
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y | Out-Null
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc.exe "/DAppVersion=$version" "/DAppDir=$PWD\dist\QuotaTray" "/DOutputDir=$PWD\dist\installer" windows\installer\QuotaTray.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }

      - name: Smoke-test installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/installer/QuotaTray-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=startup'
          if ($p.ExitCode -ne 0) { throw "install failed ($($p.ExitCode))" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\QuotaTray'
          $check = & (Join-Path $app 'quotatray-engine.exe') dashboard --cached | ConvertFrom-Json
          if ($check.schema -ne 'openusage.desktop.v1') { throw 'installed engine failed its smoke test' }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name QuotaTray -ErrorAction SilentlyContinue
          if (-not $run) { throw 'the startup task did not add Launch at Login' }
          $p = Start-Process (Join-Path $app 'unins000.exe') -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "uninstall failed ($($p.ExitCode))" }
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $app 'QuotaTray.exe')) { throw 'uninstall left the app behind' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name QuotaTray -ErrorAction SilentlyContinue) {
            throw 'uninstall left Launch at Login behind'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: QuotaTray-windows-setup
          path: dist/installer/*.exe
          if-no-files-found: error

  engine-tests-windows:
    name: Engine Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Install tools the providers shell out to
        run: choco install sqlite --no-progress -y
      - run: swift test ${{ env.STL_MISMATCH }}

  engine-linux:
    # Keeps the engine portable: the same non-Apple code paths Windows uses, on Linux.
    name: Engine Build and Test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools the providers shell out to
        run: apt-get update && apt-get install -y --no-install-recommends lsof sqlite3
      - run: swift build
      - run: swift test
