name: Windows

# Builds OpenUsage for Windows: the shared Swift engine (`openusage-cli.exe`) plus the WPF
# notification-area app (`OpenUsage.exe`), packaged into one zip artifact. See docs/windows.md.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The runner's Visual Studio ships an MSVC STL that asks for Clang 20+, newer than the Clang inside
  # the Swift 6.2 toolchain. swift-crypto's BoringSSL is the only C++ in the build and compiles fine
  # with it, so allow the mismatch rather than pinning an older Visual Studio.
  STL_MISMATCH: -Xcc -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH -Xcxx -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH

jobs:
  windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Swift
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE

      - name: Build engine
        run: swift build -c release --product openusage-cli ${{ env.STL_MISMATCH }}

      - name: Smoke-test engine
        shell: pwsh
        run: |
          $out = .build/release/openusage-cli.exe dashboard --cached | ConvertFrom-Json
          if ($out.schema -ne 'openusage.desktop.v1') { throw "unexpected schema: $($out.schema)" }
          Write-Host "providers: $($out.providers.id -join ', ')"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish tray app
        run: >
          dotnet publish windows/OpenUsage.Windows/OpenUsage.Windows.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o dist/OpenUsage

      - name: Render panel screenshots
        shell: pwsh
        run: |
          $p = Start-Process dist/OpenUsage/OpenUsage.exe -Wait -PassThru -ArgumentList @(
            '--render-preview', 'windows/OpenUsage.Windows/Preview/sample-dashboard.json', 'dist/screenshots')
          if ($p.ExitCode -ne 0) { throw "preview render failed ($($p.ExitCode))" }
          Get-ChildItem dist/screenshots | Format-Table Name, Length

      - name: Print screenshots (temporary, for review)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          foreach ($name in 'dashboard-light', 'dashboard-dark', 'settings-light') {
            $img = [System.Drawing.Image]::FromFile((Resolve-Path "dist/screenshots/$name.png"))
            $w = [int]($img.Width * 0.6); $h = [int]($img.Height * 0.6)
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = 'HighQualityBicubic'; $g.DrawImage($img, 0, 0, $w, $h)
            $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
            $params = New-Object System.Drawing.Imaging.EncoderParameters 1
            $params.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 72L
            $ms = New-Object System.IO.MemoryStream
            $bmp.Save($ms, $codec, $params)
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            Write-Host "SHOT-BEGIN $name"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { Write-Host ("SHOT " + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i))) }
            Write-Host "SHOT-END $name"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUsage-windows-screenshots
          path: dist/screenshots
          if-no-files-found: error

      - name: Package
        shell: pwsh
        run: windows/scripts/package.ps1 -BuildDir .build/release -OutDir dist/OpenUsage

      - uses: actions/upload-artifact@v4
        with:
          name: OpenUsage-windows-x64
          path: dist/OpenUsage
          if-no-files-found: error

  engine-tests-windows:
    # Informational until the suite has been triaged on Windows: many tests were written against
    # POSIX paths. Failures here show what still needs porting; they don't block the build above.
    name: Engine Tests (Windows, Informational)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - run: swift test ${{ env.STL_MISMATCH }}

  engine-linux:
    # Keeps the engine portable: the same non-Apple code paths Windows uses, on Linux.
    name: Engine Build and Test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install tools the providers shell out to
        run: apt-get update && apt-get install -y --no-install-recommends lsof sqlite3
      - run: swift build
      - run: swift test
